# Claude usage  -  how much of your 5-hour and weekly limit is used, and when it resets.
#
# Reads the sign-in of Claude Code (~/.claude/.credentials.json, read-only) and asks Anthropic for the numbers
# shown by Claude Code's /usage screen. Your token is only ever sent to api.anthropic.com.
# NOTE: this web address is undocumented and Anthropic may change it at any time. If it stops working you
# will see the reason in Settings > Plugins and the last known values stay visible (greyed out).
# You need to be signed in with Claude Code (a Pro/Max subscription; API-key-only users have no such limits).
#
# Lines starting with # are comments. Changes are picked up within a few seconds; no restart needed.

enabled = false

# Seconds between requests. Please keep this at 300 (5 minutes) or more: the server rate-limits this address.
interval = 300

# Show how much is USED ("used") or how much is LEFT ("remaining") in the bars and numbers.
show = used

# Also show the time until the limit resets next to the percentage (e.g. "62% · 2h 10m").
show_reset = false

# Which limits to read.
five_hour = true
seven_day = true
seven_day_opus = false
seven_day_sonnet = false
other_limits = false

# Colour change (percent USED): orange from "warn", red from "crit".
# A notification appears at "crit" (if notifications are on in TaskbarStats).
warn = 70
crit = 90
notify = true

# Where the Claude Code sign-in file is. "auto" = the CLAUDE_CONFIG_DIR folder or ~/.claude
# Example for a custom place:  credentials = D:\tools\claude\.credentials.json
credentials = auto

# Alternative: set the environment variable CLAUDE_CODE_OAUTH_TOKEN (then the file is not used).
