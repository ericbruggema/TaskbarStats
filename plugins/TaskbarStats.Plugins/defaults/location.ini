# Location (GPS)  -  where am I: place name, coordinates, accuracy and source (GPS / Wi-Fi / IP address).
#
# Uses the Windows location service: Settings > Privacy & security > Location, and switch on
# "Let desktop apps access your location". Without it the IP address is used (city level).
# The widget shows only the place name; coordinates are in the tooltip.
# The place name is looked up with api.bigdatacloud.net (it receives the coordinates).
#
# Lines starting with # are comments. Changes are picked up within a few seconds; no restart needed.

enabled = false

# Seconds between updates.
interval = 300

# auto (Windows location, then IP address)  |  gps (Windows location only)  |  ip
source = auto

# Look up the place name for the coordinates (needs internet). false = show coordinates only.
place_name = true

# Wanted accuracy in metres (smaller = GPS is used when available, which costs more power).
accuracy = 100

# Decimals shown in the coordinates (3 = about 100 m; use 0 to hide the exact position).
precision = 3

# Optional: your home position, then the distance from home is available as an extra item.
# Example:  home = 52.37, 4.90
home =

language = auto
