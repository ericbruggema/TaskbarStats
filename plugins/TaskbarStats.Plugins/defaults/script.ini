# Script / REST  -  put ANY value in the widget: a script, a text file or a web address (REST/JSON).
#
# One [section] per value. Use ONE of these in each section:
#   cmd  = <command>        runs under YOUR account (never as administrator), e.g.
#                           cmd = powershell -NoProfile -File "C:\scripts\inbox.ps1"
#   file = <path>           reads the first line of a text file (a script of yours may write it)
#   url  = <address>        reads a web address; add  path = data.items[0].price  to pick a value from JSON
#                           (and  header = Authorization: Bearer <token>  for APIs that need a key)
#
# What the command / file / address returns (first line):
#   42                      a number              ->  shown as 42 (with unit, bar/gauge possible)
#   42|3 builds             a number and a text   ->  bar at 42, text "3 builds"
#   Everything fine         just a text
#   {"value":42,"text":"3 builds","detail":"last run 10:31","level":"warn","color":"#ff8800"}
#                           JSON (level: ok / warn / crit)
#
# Optional per section:  short = label in the widget (empty = no label)   unit = %   min = 0   max = 100
#   warn = 70   crit = 90   (threshold colours; invert = true if LOW is bad)   widget = true   notify = false
#
# SECURITY: commands run with your own rights. Only put commands here that you trust.
# Lines starting with # are comments. Changes are picked up within a few seconds; no restart needed.

enabled = false

# Seconds between runs.
interval = 60

# Stop a command after this many seconds.
timeout = 20

# Examples (remove the # in front of each line to use it):
#
# [Free space C]
# cmd = powershell -NoProfile -Command "[math]::Round((Get-PSDrive C).Free/1GB)"
# short = C free
# unit = GB
# max = 500
#
# [Bitcoin EUR]
# url = https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur
# path = bitcoin.eur
# short = BTC
# unit = €
