# Uptime monitor  -  is my website / server / NAS / router up? Shows "3/3" and turns red when something is down.
#
# One [section] per target. Use ONE of these in each section:
#   url  = https://example.com        a web address (up = answers with a status below 400)
#   tcp  = host:port                  a port (e.g. a game server or SSH:  nas.local:22)
#   ping = host                       a ping (e.g. your router:  192.168.1.1)
# Optional per section:  expect = 200, 204   (only these HTTP status codes count as up)
#
# Lines starting with # are comments. Changes are picked up within a few seconds; no restart needed.

enabled = false

# Seconds between checks.
interval = 60

# Give up on a target after this many seconds (counts as down).
check_timeout = 8

# Answers slower than this (milliseconds) turn the item orange.
slow_ms = 1500

# Show a notification when something goes down.
notify = true

[TaskbarStats site]
url = https://taskbarstats.com

[Cloudflare DNS]
tcp = 1.1.1.1:53

# Example (remove the # in front of each line to use it):
# [Router]
# ping = 192.168.1.1
