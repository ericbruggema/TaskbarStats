# Weather  -  sun, clouds, rain, temperature, humidity, wind and chance of rain right now.
#
# Data: Open-Meteo (free, no account or key). Open-Meteo only sees the coordinates, nothing else.
#
# Lines starting with # are comments. Changes are picked up within a few seconds; no restart needed.

enabled = false

# Seconds between updates (the forecast itself only changes every ~15 minutes).
interval = 900

# Where are you?
#   auto           GPS / Wi-Fi location of Windows, falls back to your IP address
#   gps            only the Windows location service (Settings > Privacy & security > Location,
#                  also switch on "Let desktop apps access your location")
#   ip             your IP address (city-level accuracy; sends your IP address to ipwho.is)
#   Amsterdam      a place name (looked up with Open-Meteo)
#   52.37, 4.90    fixed coordinates
location = auto

# metric (°C, km/h, mm)  or  imperial (°F, mph, inch)
units = metric

# Language of the descriptions: auto (follow Windows), en, nl or de
language = auto

# How long (minutes) a found location is reused before looking again.
location_cache = 30
