template_name = Air quality
template_desc = The European air quality index and fine dust (PM2.5) for a place of your choice (Open-Meteo, free, no key).
template_needs = Nothing. Change latitude and longitude in the address to your own place.

# Air quality from Open-Meteo. The index: 0-20 good, 20-40 fair, 40-60 moderate, 60-80 poor, 80-100 very poor, over 100 extremely poor.
# The coordinates below are Amsterdam; replace them.
type = recipe
title = Air quality
enabled = false
interval = 1800

url = https://air-quality-api.open-meteo.com/v1/air-quality?latitude=52.37&longitude=4.89&current=pm2_5,european_aqi

[aqi]
label = Air quality index
short = AQI
value = current.european_aqi
min = 0
max = 100
format = {value:0}
detail = Air quality index {value:0} (PM2.5: {current.pm2_5:0.0} µg/m³)
warn = 60
crit = 80

[pm25]
label = Fine dust (PM2.5)
short = PM2.5
value = current.pm2_5
unit = µg/m³
max = 50
format = {value:0.0}
widget = false
