template_name = Claude usage (editable recipe)
template_desc = The same numbers as the built-in 'Claude usage' plugin (5-hour and weekly limit), written as a recipe that you can edit: other thresholds, other texts, extra limits.
template_needs = Signed in with Claude Code: run 'claude' in a terminal and type /login (once).

# Claude usage as a recipe.
# Reads your Claude Code sign-in (the access token in ~/.claude/.credentials.json) and asks Anthropic for the numbers that
# Claude Code's /usage screen shows. The token is only sent to api.anthropic.com. That address is undocumented and may change.
type = recipe
title = Claude usage
enabled = false
interval = 300
help = Sign in once: run 'claude' in a terminal and type /login.

url = https://api.anthropic.com/api/oauth/usage
header = Authorization: Bearer {file:~/.claude/.credentials.json#claudeAiOauth.accessToken}
header = anthropic-beta: oauth-2025-04-20

# One [section] per value. 'value' is a formula over the reply; 'when' hides the value if the reply does not have it.
[five_hour]
label = Claude 5-hour limit
short = 5h
when = five_hour != null
value = clamp(coalesce(five_hour.utilization, 0), 0, 100)
unit = %
format = {value:0}%
detail = {value:0}% used{five_hour.resets_at ? ', free again in ' + until(five_hour.resets_at) + ' (' + clock(five_hour.resets_at, 'ddd HH:mm') + ')' : ''}
warn = 70
crit = 90
notify = true
reset = five_hour.resets_at

[seven_day]
label = Claude weekly limit
short = 7d
when = seven_day != null
value = clamp(coalesce(seven_day.utilization, 0), 0, 100)
unit = %
format = {value:0}%
detail = {value:0}% used{seven_day.resets_at ? ', free again in ' + until(seven_day.resets_at) + ' (' + clock(seven_day.resets_at, 'ddd HH:mm') + ')' : ''}
warn = 70
crit = 90
notify = true
reset = seven_day.resets_at

# Optional: weekly limit for Opus (shown in the tooltip, not in the widget). Remove the '#' signs to use it.
