template_name = Crypto price
template_desc = The price of a coin in euros and its change over 24 hours (CoinGecko, free, no key).
template_needs = Nothing. Change 'bitcoin' and 'eur' in the address and in the values to use another coin or currency.

# Crypto price from CoinGecko. The reply looks like {"bitcoin": {"eur": 68183, "eur_24h_change": 0.83}}.
type = recipe
title = Crypto price
enabled = false
interval = 300

url = https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true

[price]
label = Bitcoin
short = BTC
value = bitcoin.eur
unit = €
min = 0
max = 100000
format = €{value:#,##0}
detail = Bitcoin €{value:#,##0}, {bitcoin.eur_24h_change:+0.0}% in 24 hours

[change]
label = Bitcoin, 24 hours
short = 24h
value = bitcoin.eur_24h_change
unit = %
format = {value:+0.0}%
level = value <= -5 ? 'warn' : 'ok'
widget = false
