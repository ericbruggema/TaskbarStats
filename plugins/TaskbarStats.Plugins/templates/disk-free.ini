template_name = Free disk space (any drive)
template_desc = Free space of one drive in GB, orange below 50 GB and red below 20 GB.
template_needs = Nothing special. This recipe RUNS A POWERSHELL COMMAND as you (without administrator rights); you approve that when you add it. Change C to another drive letter.

# Free space of drive C. The command prints a number of gigabytes; 'invert' means that LOW values are bad.
type = recipe
title = Disk space
enabled = false
interval = 300

cmd = powershell -NoProfile -Command "[math]::Round((Get-PSDrive C).Free / 1GB, 1)"

[free]
label = Free space on C:
short = C:
value = num(text)
unit = GB
max = 500
format = {value:0} GB
detail = {value:0.0} GB free on C:
invert = true
warn = 50
crit = 20
notify = true
