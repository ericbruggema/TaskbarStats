template_name = Docker containers running
template_desc = The number of Docker containers that are running now.
template_needs = Docker installed and its command available to your Windows account. This recipe RUNS A COMMAND as you (without administrator rights); you approve that when you add it.

# Docker: counts the lines that 'docker ps -q' prints (one container id per line).
type = recipe
title = Docker
enabled = false
interval = 60

cmd = docker ps -q

[running]
label = Docker containers
short = Docker
value = count(lines)
format = {value}
detail = {value} container(s) running
