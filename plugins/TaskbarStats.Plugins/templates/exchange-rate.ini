template_name = Exchange rate
template_desc = How many dollars one euro is worth (European Central Bank rates via frankfurter.dev, free, no key, updated once per working day).
template_needs = Nothing. Change base=EUR and symbols=USD in the address (and USD in the value) for other currencies.

# Exchange rate. The reply looks like {"base": "EUR", "date": "2026-11-06", "rates": {"USD": 1.1165}}.
type = recipe
title = Exchange rate
enabled = false
interval = 3600

url = https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD

[usd]
label = EUR to USD
short = EUR/USD
value = rates.USD
unit = USD
min = 0
max = 2
format = {value:0.0000}
detail = 1 {base} = {rates.USD:0.0000} USD (rate of {date})
