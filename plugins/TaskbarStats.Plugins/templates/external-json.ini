template_name = Own script writes the values (JSON file)
template_desc = Registers a source that YOUR OWN program or script fills: it writes a small JSON file and TaskbarStats shows the values. No code of this plugin runs; use it with any language or scheduled task.
template_needs = A program of your own that writes plugins\<name>.json in the data folder (see the handbook for the format).

# External source. TaskbarStats starts nothing for this plugin. Your own script writes the file
#   %AppData%\TaskbarStats\plugins\<this file's name>.json     (the name of this .ini file without .ini)
# Minimal content of that file:
#   {"plugin": "<name>", "title": "My script", "updated": "2026-01-01T12:00:00Z", "ttl": 300, "status": "ok",
#    "items": [ {"key": "temp", "label": "Room temperature", "value": 21.5, "unit": "°C", "text": "21.5°"} ]}
# 'ttl' is how many seconds the values stay fresh; after that they are shown greyed out with a '?'.
type = external
title = My script
enabled = false
