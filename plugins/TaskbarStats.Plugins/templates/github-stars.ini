template_name = GitHub repository
template_desc = The number of stars and open issues of a GitHub repository.
template_needs = Nothing (GitHub allows 60 requests per hour without a key; the default interval is 10 minutes). Change owner/repo below.

# GitHub repository. Replace ericbruggema/TaskbarStats with the repository you like.
type = recipe
title = GitHub repository
enabled = false
interval = 600

url = https://api.github.com/repos/ericbruggema/TaskbarStats

[stars]
label = {full_name} stars
short = ★
value = stargazers_count
format = {value:#,##0}
detail = {full_name}: {stargazers_count} stars, {forks_count} forks

[issues]
label = {full_name} open issues
short = Issues
value = open_issues_count
format = {value}
widget = false
