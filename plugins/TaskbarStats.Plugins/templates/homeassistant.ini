template_name = Home Assistant sensor
template_desc = The state of one Home Assistant entity (a temperature, a power meter, a switch) as a value in the widget.
template_needs = A long-lived access token from Home Assistant (your profile page), saved under Settings > Plugins > Secrets with the name 'homeassistant'. Change the address and the entity.

# Home Assistant: one entity. Replace the address and the entity id (sensor.living_room_temperature).
# The token is NOT written here: it lives in the Windows vault (Settings > Plugins > Secrets, name: homeassistant).
type = recipe
title = Home Assistant
enabled = false
interval = 60

url = http://homeassistant.local:8123/api/states/sensor.living_room_temperature
header = Authorization: Bearer {secret:homeassistant}

[sensor]
label = {attributes.friendly_name}
short = Room
value = state
unit = °C
format = {value:0.0}°
detail = {attributes.friendly_name}: {state} {attributes.unit_of_measurement}, changed {ago(last_changed)} ago
