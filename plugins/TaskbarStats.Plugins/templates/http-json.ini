template_name = Blank recipe: web address (JSON)
template_desc = A starting point to read any web address that returns JSON. Fill in the address and say which field you want.
template_needs = Nothing. Read the handbook (docs/plugins.md) for all options and the formulas.

# A blank recipe. Steps: 1) put the address after url =, 2) open it in your browser to see the field names,
# 3) write the field after value =, 4) set enabled = true. Use the Test button in the editor.
type = recipe
title = My recipe
enabled = false
interval = 60

url = https://example.com/api/status.json
# Needs a key? Save it under Settings > Plugins > Secrets and write:   header = Authorization: Bearer {secret:mykey}

[value1]
label = My value
short = Val
# 'value' is a formula. Examples:  price   data.items[0].price   round(temp * 9 / 5 + 32)   count(items)
value = price
unit =
format = {value:0.0}
detail = My value: {value}
# Colour rules: warn = 70 and crit = 90 (high is bad), or write your own:  level = value > 90 ? 'crit' : 'ok'
