template_name = Pi-hole
template_desc = Percentage of DNS queries your Pi-hole blocked today, and whether blocking is on. A notification when blocking is switched off.
template_needs = Pi-hole version 5 on your network (address pi.hole, or change it). Version 6 needs a login: see the handbook.

# Pi-hole (v5 API). Change the address if your Pi-hole is not reachable as pi.hole.
type = recipe
title = Pi-hole
enabled = false
interval = 60

url = http://pi.hole/admin/api.php?summaryRaw

[blocked]
label = Pi-hole blocked today
short = Ads
value = ads_percentage_today
unit = %
format = {value:0.0}%
detail = {ads_blocked_today:#,##0} of {dns_queries_today:#,##0} queries blocked today

[status]
label = Pi-hole blocking
short = Pi-hole
value = status == 'enabled' ? 1 : 0
format = {status == 'enabled' ? 'on' : 'OFF'}
detail = Blocking is {status}
level = status == 'enabled' ? 'ok' : 'crit'
notify = true
widget = false
