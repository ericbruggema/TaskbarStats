template_name = Service status page
template_desc = Shows whether a service reports problems on its public status page (GitHub, Claude and many others use the same format). Red plus a notification on a major outage.
template_needs = Nothing. Replace the address with the status page of another service (it ends in /api/v2/status.json).

# Status page (Atlassian Statuspage format). The reply has status.indicator = none | minor | major | critical.
# Other examples: https://status.claude.com/api/v2/status.json   https://www.cloudflarestatus.com/api/v2/status.json
type = recipe
title = Service status
enabled = false
interval = 120

url = https://www.githubstatus.com/api/v2/status.json

[status]
label = {page.name} status
short = {page.name}
value = status.indicator == 'none' ? 1 : 0
format = {status.indicator == 'none' ? 'OK' : upper(status.indicator)}
detail = {page.name}: {status.description}
level = status.indicator == 'none' ? 'ok' : status.indicator == 'minor' ? 'warn' : 'crit'
notify = true
