template_name = Value from a text file
template_desc = Reads a number from a text file that another program keeps up to date (a backup log, a status file, a counter).
template_needs = The path of your file. This recipe READS A FILE on your pc; you approve that when you add it.

# Reads the first number in the file. Change the path and the formula. 'text' is the whole file, 'lines' the non-empty lines.
type = recipe
title = Text file
enabled = false
interval = 60

file = %USERPROFILE%\status.txt

[number]
label = Number from file
short = File
value = num(regex(text, '(\d+(\.\d+)?)'))
format = {value}
detail = Last line: {last(lines)}
